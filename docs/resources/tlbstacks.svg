<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b4249"/>
      <stop offset="1" stop-color="#262a2f"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a525a"/>
      <stop offset="1" stop-color="#31363b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6cc7f5"/>
      <stop offset="1" stop-color="#3daee9"/>
    </linearGradient>
  </defs>

  <!-- soft shadow -->
  <ellipse cx="64" cy="121" rx="46" ry="4" fill="#000" opacity="0.18"/>

  <!-- stack popup card -->
  <rect x="28" y="8" width="72" height="82" rx="10" fill="url(#card)" stroke="#3daee9" stroke-width="2"/>
  <!-- pointer toward the launcher button -->
  <path d="M55 89 L73 89 L64 99 Z" fill="#262a2f" stroke="#3daee9" stroke-width="2" stroke-linejoin="round"/>
  <rect x="56" y="87" width="16" height="4" fill="#262a2f"/>

  <!-- category header: dashes + label -->
  <rect x="36" y="20" width="14" height="2.5" rx="1.25" fill="#7f8c8d"/>
  <rect x="55" y="18.5" width="18" height="5" rx="2.5" fill="#9aa5a8"/>
  <rect x="78" y="20" width="14" height="2.5" rx="1.25" fill="#7f8c8d"/>

  <!-- row 1 -->
  <rect x="36" y="30" width="11" height="11" rx="3" fill="#3daee9"/>
  <rect x="52" y="33" width="36" height="5" rx="2.5" fill="#eff0f1" opacity="0.9"/>
  <!-- row 2 -->
  <rect x="36" y="46" width="11" height="11" rx="3" fill="#f67400"/>
  <rect x="52" y="49" width="28" height="5" rx="2.5" fill="#eff0f1" opacity="0.9"/>
  <!-- separator -->
  <rect x="36" y="63" width="56" height="2" rx="1" fill="#7f8c8d" opacity="0.8"/>
  <!-- row 3 -->
  <rect x="36" y="70" width="11" height="11" rx="3" fill="#1cdc9a"/>
  <rect x="52" y="73" width="32" height="5" rx="2.5" fill="#eff0f1" opacity="0.9"/>

  <!-- panel / launch bar -->
  <rect x="10" y="100" width="108" height="20" rx="7" fill="url(#bar)"/>
  <rect x="10" y="100" width="108" height="20" rx="7" fill="none" stroke="#1b1e20" stroke-width="1"/>
  <!-- active indicator tab -->
  <rect x="48" y="100" width="32" height="3" rx="1.5" fill="#3daee9"/>
  <!-- launcher buttons -->
  <circle cx="28" cy="110" r="5" fill="#7f8c8d"/>
  <circle cx="64" cy="110" r="6.5" fill="url(#accent)"/>
  <circle cx="100" cy="110" r="5" fill="#7f8c8d"/>
</svg>
