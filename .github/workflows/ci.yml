name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    container:
      image: fedora:44
    steps:
      - name: Install build dependencies
        run: |
          dnf -y --setopt=install_weak_deps=False install \
            git cmake extra-cmake-modules gcc-c++ \
            qt6-qtbase-devel qt6-qtdeclarative-devel \
            kf6-kio-devel kf6-kservice-devel \
            plasma-activities-devel plasma-activities-stats-devel \
            python3 zip
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Build and run all test suites
        run: scripts/ci-run.sh
      - name: Run release pipeline regression tests
        run: tests/test_release_scripts.sh
